[theme]
base = "light"
primaryColor = "#0369A1"
backgroundColor = "#F4F8FB"
secondaryBackgroundColor = "#E6F0F7"
textColor = "#0B1F33"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
